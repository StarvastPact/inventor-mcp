# inventor-mcp —— 把 Autodesk Inventor 接进 DSH 的 MCP 连接配置（stdio 传输）
#
# 启动器 run_inventor_mcp.py 自行推导仓库内路径，离线可用：
#   runtime/pylibs/          Python 依赖（mcp / pywin32 等）
#   runtime/ext/<server>/    inventor_mcp_server 源码
#   runtime/logs/server.log  启动与异常日志
#
# 如果系统 Python 里已经 `pip install inventor-mcp-server pywin32`，
# 可以把 args 换成 ['-m', 'inventor_mcp_server.server']。
#
# 仓库克隆到其它目录后请运行 install.ps1 —— 它会重写下面的 args 绝对路径与 command。
- insert:
    - id: inventor-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: inventor
        transport: stdio
        command: 'python'
        args:
          - '-u'
          - 'D:\SHU Files\dsh-repo\inventor-mcp\run_inventor_mcp.py'
        env:
          PYTHONIOENCODING: 'utf-8'
          PYTHONUNBUFFERED: '1'
          INVENTOR_MCP_PRELOAD: ''
        failOnStartupError: true